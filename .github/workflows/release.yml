name: Release

# Builds Nexus installers for Windows, macOS (Apple Silicon) and Linux and
# publishes them to a GitHub Release. Trigger: Actions → Release → Run workflow,
# or push a tag like v0.1.0. The release tag tracks the version in package.json.
#
# Pattern: one job creates a DRAFT release (deleting any existing one for the tag
# so re-runs are clean), the matrix build jobs upload their installers to it via
# releaseId (no create-race), and a final job un-drafts it — only if all three
# platforms built.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = `v${{ steps.v.outputs.version }}`;
            // Remove any existing release for this tag so re-runs start clean.
            try {
              const ex = await github.rest.repos.getReleaseByTag({ owner: context.repo.owner, repo: context.repo.repo, tag });
              await github.rest.repos.deleteRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: ex.data.id });
            } catch (e) { /* no existing release — fine */ }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Nexus ${tag}`,
              body: [
                'Download the installer for your platform below.',
                '',
                '**Unsigned builds:**',
                '- **Windows**: SmartScreen may warn — click *More info → Run anyway*.',
                '- **macOS**: run `xattr -cr /Applications/Nexus.app` once, or right-click the app → *Open*.',
                '- **Linux**: use the `.AppImage` (chmod +x) or the `.deb`.'
              ].join('\n'),
              draft: true,
              prerelease: false
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            target: ""
            args: "--config src-tauri/tauri.bundle.conf.json"
          - os: macos-latest
            triple: aarch64-apple-darwin
            target: aarch64-apple-darwin
            args: "--config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin"
          # Linux: .deb + .rpm only. AppImage (linuxdeploy) is flaky on the runner
          # and is needed only for Linux auto-update — deferred as a follow-up.
          - os: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
            target: ""
            args: "--config src-tauri/tauri.bundle.conf.json --bundles deb,rpm"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Defender can transiently lock files in the large bundled node_modules
      # during resource copy → "Access is denied". Excluding the workspace avoids it.
      - name: Exclude workspace from Windows Defender
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"
        continue-on-error: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Assemble bundled engine + Node runtime
        shell: bash
        run: bash scripts/assemble-bundle.sh "${{ matrix.triple }}" "$(command -v node)"

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Key has no password; GitHub forbids empty secrets, so set it inline.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # AppImage tooling (linuxdeploy) is itself an AppImage; extract-and-run
          # avoids needing FUSE on the runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Un-draft the release (all platforms built)
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
